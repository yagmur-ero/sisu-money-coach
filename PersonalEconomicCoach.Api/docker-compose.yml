services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-economic-coach-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Server=${MYSQL_HOST};Port=${MYSQL_PORT:-3307};Database=spankki;User ID=${MYSQL_USER};Password=${MYSQL_PASSWORD};Allow User Variables=true;"
      App__DemoCustomerId: ${DEMO_CUSTOMER_ID:-CUST00001}
      Ai__ApiKey: ${OPENAI_API_KEY:-}
      Ai__Model: ${OPENAI_MODEL:-gpt-4.1-mini}
    ports:
      - "5080:8080"
